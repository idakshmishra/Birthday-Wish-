<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#ff758c,#ff7eb3);
    color:#fff;
    text-align:center;
    overflow:hidden;
}
.container{
    padding:40px 15px;
}
h1{
    font-size:2.5em;
    margin-bottom:10px;
}
h2{
    font-size:1.5em;
    margin-bottom:20px;
}
.card{
    background: rgba(255,255,255,0.15);
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}
p{
    font-size:1.1em;
    line-height:1.6;
}
button{
    background:#fff;
    color:#ff4d6d;
    border:none;
    padding:12px 25px;
    font-size:1em;
    border-radius:25px;
    cursor:pointer;
    margin-top:20px;
}
button:hover{
    background:#ffe3ea;
}
.heart{
    font-size:40px;
    animation: beat 1s infinite;
}
@keyframes beat{
    0%{transform:scale(1)}
    50%{transform:scale(1.2)}
    100%{transform:scale(1)}
}
canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>
<canvas id="confetti"></canvas>

<div class="container">
    <h1>🎉 Happy Birthday 🎉</h1>
    <h2>My Love ❤️</h2>

    <div class="card">
        <div class="heart">❤️</div>
        <p>
            Aaj ka din mere liye sabse special hai,  
            kyunki aaj meri zindagi ki sabse khoobsurat wajah ka birthday hai.  
            Tum meri muskaan ho, meri strength ho aur mera sab kuch ho 💕  
        </p>
        <p>
            Main dua karta hoon ki tumhari har wish poori ho,  
            aur hum dono hamesha aise hi saath rahein 🥰
        </p>

        <button onclick="playMusic()">🎶 Play Music</button>
    </div>
</div>

<audio id="music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script>
// Music
function playMusic(){
    document.getElementById("music").play();
}

// Confetti
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];
for(let i=0;i<150;i++){
    confetti.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*6+2,
        d: Math.random()*Math.PI*2
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confetti.forEach(c=>{
        ctx.beginPath();
        ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,0.8)";
        ctx.fill();
        c.y += 2;
        if(c.y > canvas.height) c.y = 0;
    });
    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
